[package]
name = "flowday-react"
version = "0.2.0"
description = "FlowDay desktop client"
edition = "2021"

[lib]
name = "flowday_react_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-live-activity = { path = "plugins/live-activity" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
